<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: rgb(18, 14, 10); 
}
canvas {
  display: block;
  touch-action: none;
}
</style>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/addons/p5.sound.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mdbassit/Coloris@latest/dist/coloris.min.css"/>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
      .custom-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 150px;
        height: 6px;
        background: transparent;
        border-radius: 10px;
        outline: none;
      }
      .custom-slider::-webkit-slider-runnable-track {
        height: 12px;
        background: transparent;
        border-radius: 0;
        box-shadow: 0 0 0 3px black;
      }
      .custom-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 12px;
        background: #000000;
        border-radius: 0%;
        border: none;
        cursor: pointer;
        margin-top: 0px;
      }
      .custom-slider:active::-webkit-slider-thumb {
        background: #bc271a;
      }
      .custom-slider::-moz-range-track {
        height: 12px;
        background: transparent;
        border-radius: 0px;
        box-shadow: 0 0 0 3px black;
      }
      .custom-slider::-moz-range-thumb {
        appearance: none;
        width: 14px;
        height: 12px;
        border: none;
        background: black;
        border-radius: 0%;
        cursor: pointer;
      }
      .custom-slider:active::-moz-range-thumb {
        background: #bc271a;
      }
    </style>

    <!-- Firebase -->
    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDjsgtW5_RUOpzR0TbiMY4HGlcyFRrOu5g",
    authDomain: "entropix-a6d15.firebaseapp.com",
    projectId: "entropix-a6d15",
    storageBucket: "entropix-a6d15.firebasestorage.app",
    messagingSenderId: "626387238040",
    appId: "1:626387238040:web:40cb69e887aca3eab064ed"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // Expose to window so p5.js sketch can access them
  window._db = db;
  window._fsCollection = collection;
  window._fsAddDoc = addDoc;
  window._fsTimestamp = serverTimestamp;

  signInAnonymously(auth)
    .then(() => console.log("anon auth ready"))
    .catch(console.error);
</script>
    
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/gh/mdbassit/Coloris@latest/dist/coloris.min.js"></script>
    <script src="declare.js"></script>
    <script src="sketch.js"></script>
    
    <div id="loadingScreen" style="
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #12100a;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
">
  <div id="loadingText" style="
    font-family: 'Doto', monospace;
    font-size: 18px;
    color: #b48c50;
    letter-spacing: 2px;
  ">loading...</div>
</div>
<script>
  window._hideLoadingScreen = function() {
    const screen = document.getElementById('loadingScreen');
    screen.style.transition = 'opacity 0.4s';
    screen.style.opacity = '0';
    setTimeout(() => screen.remove(), 400);
  };
</script>
  </body>
</html>
